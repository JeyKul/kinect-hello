[package]
name = "kface-fprintd"
version = "0.1.0"
edition = "2021"
description = "fprintd-compatible D-Bus service that authenticates with Kinect face verification"
license = "MIT"

[dependencies]
futures-util = "0.3"
libc = "0.2"
tokio = { version = "1", features = ["rt", "macros", "process", "io-util", "sync", "time"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[profile.release]
strip = true
